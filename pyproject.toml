[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wlanpi-mcp"
description = "MCP server for the WLAN Pi"
requires-python = ">=3.13"
license = "BSD-3-Clause"
dynamic = ["version"]
authors = [
    {name = "Jake Snyder"},
]
classifiers = [
    "Natural Language :: English",
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: System Administrators",
    "Topic :: Utilities",
]

dependencies = [
    # <2: mcp 2.x renames FastMCP to MCPServer and breaks this server wholesale
    "mcp[cli]>=1.0,<3",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "anyio>=4.0",
    "starlette>=0.37",
    "uvicorn>=0.29",
    "websockets>=12",
]

[project.optional-dependencies]
testing = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "respx>=0.21",
    "coverage",
]

[project.scripts]
wlanpi-mcp = "wlanpi_mcp.__main__:main"

[tool.setuptools.packages.find]
include = ["wlanpi_mcp*"]

[tool.setuptools.dynamic]
version = {attr = "wlanpi_mcp.__version__.__version__"}

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
# E/W/F core style + pyflakes, I imports, B/BLE bugbear+blind-except, C4
# comprehensions, UP pyupgrade modernization, RUF ruff-specific. Docstrings
# use the Google convention (the MCP SDK ships each function's __doc__ as the
# client-visible tool/resource/prompt description, so missing ones surface
# directly to users): enforce presence (D100-D106) plus the Google-style
# formatting rules. MCP tools must be declared async to register, so RUF029
# (unused-async) would flag every tool: keep it off. E501 is owned by
# `ruff format`: the formatter leaves long docstring/string lines alone, so
# linting them would be unsatisfiable.
select = [
    "E", "W", "F", "I", "B", "BLE", "C4", "UP", "RUF",
    "D100", "D101", "D102", "D103", "D104", "D105", "D106",
    "D200", "D205", "D209", "D401", "D415",
]
ignore = ["E501", "RUF029"]

[tool.ruff.lint.per-file-ignores]
# Tests are linted and formatted with the same rules, but test functions
# self-describe (test_* names); docstring-presence rules add noise there.
"tests/**" = ["D100", "D101", "D102", "D103", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["wlanpi_mcp"]
