# wlanpi-mcp nginx site: front the MCP daemon (streamable HTTP) with nginx. Two listeners, both
# proxying to the same loopback-only uvicorn daemon (127.0.0.1:8768):
#
#   * 8766 - plaintext HTTP. Legacy port, kept for MCP harnesses that cannot
#     validate the self-signed cert (e.g. goose, which has no way to skip cert
#     verification). The wlanpi-core JWT crosses the LAN in cleartext here:
#     use it only on a trusted network / during development. Harnesses that can
#     trust the cert should prefer 8767.
#   * 8767 - TLS with the device's self-signed cert. Preferred endpoint for
#     harnesses that can be pointed at the cert (add self-signed-wlanpi.cert to
#     their trust store).
#
# /mcp maps 1:1 through proxy_pass (no prefix). The transport is stateless with
# JSON responses: one POST per MCP call and no long-lived stream. Buffering
# stays off and the timeouts long so a slow tool call (a 60 s capture) is not
# cut off and its result reaches the client the moment it completes.

server {
    listen 8766;
    server_name _;

    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # One POST per MCP call; disable buffering so tool results reach the
        # client immediately and long tool calls (captures) are not cut off.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_pass http://127.0.0.1:8768;
    }
}

server {
    listen 8767 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/self-signed-wlanpi.cert;
    ssl_certificate_key /etc/nginx/ssl/self-signed-wlanpi.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_pass http://127.0.0.1:8768;
    }
}