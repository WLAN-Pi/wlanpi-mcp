# wlanpi-mcp nginx site: front the SSE daemon with the device's self-signed TLS
# so the wlanpi-core JWT never crosses the LAN in cleartext.
#
# The uvicorn daemon binds loopback-only (127.0.0.1:8767) and is reached here;
# clients connect to https://<wlanpi>:8766/sse on the same port the old plaintext
# listener used, so the scheme is the only change on the client side.
#
# /sse and /messages/?session_id=... map 1:1 through proxy_pass (no prefix), so
# the MCP SSE transport's relative 'endpoint' event needs no root_path handling.

server {
    listen 8766 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/self-signed-wlanpi.cert;
    ssl_certificate_key /etc/nginx/ssl/self-signed-wlanpi.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long-lived SSE stream and per-message POSTs; disable buffering so the
        # endpoint event and tool results reach the client immediately.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_pass http://127.0.0.1:8767;
    }
}