# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Run Python Tests

on:
  # Allow manual runs of workflow from Actions tab
  workflow_dispatch:

  push:
    paths-ignore: # ignore files that don't change build output
      - '**.md'
      - .github/dependabot.yml
      - .gitignore
      - LICENSE
  pull_request:
    paths-ignore: # ignore files that don't change build output
      - '**.md'
      - .github/dependabot.yml
      - .gitignore
      - LICENSE

permissions:
  contents: read
  actions: read

jobs:
  python:
    runs-on: "ubuntu-26.04"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install tox
      run: |
        python -m ensurepip --upgrade
        python -m pip install --upgrade "tox>=4"

    - name: Run tests with tox
      id: tox-run
      run: |
        tox

  discord-workflow-status:
    if: ${{ always() && github.repository_owner == 'WLAN-Pi' && ! github.event.pull_request.head.repo.fork && github.actor != 'dependabot[bot]' }}
    name: Post Workflow Status to Discord
    needs:
      - python
    uses: WLAN-Pi/gh-workflows/.github/workflows/discord-workflow-status.yml@main
    permissions:
      actions: read
      contents: read
    with:
      parent_run_id: ${{ github.run_id }}
    secrets: inherit
