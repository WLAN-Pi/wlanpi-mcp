[tox]
skip_missing_interpreters = true
envlist = py313
requires = setuptools >= 65.5.0
           pip >= 22.3
           virtualenv >= 20.16.6

[testenv]
description = run the test driver
deps =
    pytest
    pytest-asyncio
    pytest-mock
    respx
    coverage
    genbadge[coverage]
    pydantic-settings
commands =
    coverage run --source wlanpi_mcp -m pytest --asyncio-mode=auto {posargs}
    coverage report --show-missing
    coverage xml
    genbadge coverage -i coverage.xml -o coverage.svg

[testenv:lint]
# Installs the package so mypy can resolve the runtime deps it imports
# (mcp, uvicorn, httpx, ...); without them every import is import-not-found.
deps =
    ruff
    mypy>=1.14.1
commands =
    ruff check wlanpi_mcp tests
    mypy wlanpi_mcp

[testenv:formatcheck]
description = run the format check toolchain
basepython = python3
skip_install = true
deps =
    ruff
commands =
    ruff format --check wlanpi_mcp tests

[testenv:format]
description = run the format toolchain
basepython = python3
skip_install = true
deps =
    ruff
commands =
    ruff format wlanpi_mcp tests